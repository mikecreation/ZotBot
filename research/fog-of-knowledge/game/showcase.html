<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live crafting showcase</title>
<style>*{box-sizing:border-box}body{height:100dvh;display:flex;flex-direction:column;margin:0;background:#061017;color:#e9edf0;font:14px system-ui}header{padding:14px 18px;border-bottom:1px solid #34505d}h1{font-size:19px;margin:0 0 5px}p{margin:4px 0;color:#b1c8d1}nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}button,a{font:inherit;color:#e9edf0;background:#132631;border:1px solid #395c6d;border-radius:6px;padding:8px 12px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#254b5b;border-color:#81d1e5}iframe{width:100%;flex:1;height:0;border:0;min-height:300px}#status{color:#ffd98d;margin-top:9px}</style>
<header><h1>Live crafting showcase</h1><p>Explore the actual game models and actions in a sandbox. Your saved world stays untouched.</p>
<nav><button data-scene="benches">Both benches & all tools</button><button data-scene="knife_stone">Stone knife</button><button data-scene="axe_stone">Lashed axe</button><button data-scene="pickaxe_stone">Pickaxe</button><button data-scene="bench_joint">Notch & tongue</button><button data-scene="drill">Hand-drill fire</button><button data-scene="fire">Burning logs</button><button data-scene="rain">Rain & fire</button><button data-scene="pickup">Hover & distant E pickup</button><a href="index.html#world">Return to your world</a></nav><p id="status" role="status">Loading the live scene…</p></header>
<iframe id="game" title="Live game sandbox" src="index.html?sandbox=crafting#world" allow="autoplay"></iframe>
<script type="module">
const frame=document.querySelector('#game'),status=document.querySelector('#status');
frame.addEventListener('load',()=>{const s=frame.contentDocument.createElement('script');s.type='module';s.src='./showcase-scene.js?v=3.12.3';frame.contentDocument.body.append(s)});
document.querySelector('nav').addEventListener('click',e=>{const scene=e.target.dataset.scene;if(!scene)return;for(const b of document.querySelectorAll('[data-scene]'))b.setAttribute('aria-pressed',String(b===e.target));frame.contentWindow.postMessage({type:'crafting-showcase',scene},location.origin)});
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.type==='crafting-showcase-status'){status.textContent=e.data.text;for(const b of document.querySelectorAll('[data-scene]'))b.setAttribute('aria-pressed',String(b.dataset.scene===e.data.scene))}});
</script></html>
