<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>Fog JWST sky</title>
  <style>
    html, body, #aladin-lite-div { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #status {
      position: absolute; left: 8px; bottom: 8px; z-index: 5;
      color: #d7ffe8; font: 12px/1.35 system-ui, Segoe UI, sans-serif;
      background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 6px;
      pointer-events: none; max-width: 92%;
    }
  </style>
</head>
<body>
  <div id="aladin-lite-div"></div>
  <div id="status">Loading JWST HiPS…</div>
  <script type="text/javascript" src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>
  <script type="text/javascript">
    (function () {
      var p = new URLSearchParams(window.location.search);
      var ra = parseFloat(p.get("ra"));
      var dec = parseFloat(p.get("dec"));
      var rawFov = parseFloat(p.get("fov"));
      var fov = isFinite(rawFov) ? Math.min(0.25, Math.max(0.008, rawFov)) : 0.04;
      var survey = p.get("survey") || "https://alasky.cds.unistra.fr/JWST/CDS_P_JWST_deep_field_smacs0723-5mb";
      var label = p.get("label") || "JWST";
      var hasTarget = isFinite(ra) && isFinite(dec);
      var target = hasTarget ? (ra.toFixed(4) + " " + dec.toFixed(4)) : "110.8375 -73.4545";
      var statusEl = document.getElementById("status");
      var FOV_MIN = 0.008;
      var FOV_MAX = 0.25; /* stay on the deep-field patch; never all-sky */

      var JWST_ONLY = [
        "https://alasky.cds.unistra.fr/JWST/CDS_P_JWST_deep_field_smacs0723-5mb",
        "https://alasky.cds.unistra.fr/JWST-outreach/CDS_P_JWST_EPO",
        "https://alasky.cds.unistra.fr/JWST/CDS_P_JWST_Stephans-Quintet_NIRCam-MIRI",
        "https://alasky.cds.unistra.fr/JWST/CDS_P_JWST_Carina-Nebula_NIRCam",
        "https://alasky.cds.unistra.fr/JWST/CDS_P_JWST_First_Images"
      ];

      function reassert(aladin) {
        try { aladin.setProjection("SIN"); } catch (e) {}
        try {
          if (typeof aladin.setBaseImageLayer === "function") aladin.setBaseImageLayer(survey);
          else if (typeof aladin.setImageSurvey === "function") aladin.setImageSurvey(survey);
        } catch (e) {}
        try { aladin.setFoV(fov); } catch (e) {}
        try {
          if (hasTarget) aladin.gotoRaDec(ra, dec);
        } catch (e) {}
      }

      A.init.then(function () {
        var aladin = A.aladin("#aladin-lite-div", {
          survey: survey,
          fov: fov,
          target: target,
          projection: "SIN",
          cooFrame: "ICRSd",
          showLayersControl: false,
          expandLayersControl: false,
          showProjectionControl: false,
          showFullscreenControl: false,
          showShareControl: false,
          showSimbadPointerControl: false,
          showCooGridControl: false,
          showSettingsControl: false,
          showGotoControl: false,
          showCatalog: false,
          showReticle: true,
          showFrame: true,
          showFov: true,
          hipsList: JWST_ONLY
        });

        try {
          if (typeof aladin.setFovRange === "function") aladin.setFovRange(FOV_MIN, FOV_MAX);
        } catch (e) {}

        reassert(aladin);
        setTimeout(function () { reassert(aladin); }, 350);
        setTimeout(function () { reassert(aladin); }, 1200);
        setTimeout(function () { reassert(aladin); }, 2800);

        function tick() {
          try {
            var f = aladin.getFov();
            var rd = aladin.getRaDec();
            var f0 = f && isFinite(f[0]) ? f[0] : fov;
            /* Clamp runaway FoV if user/wheel fights the range */
            if (f0 > FOV_MAX + 0.01) {
              try { aladin.setFoV(FOV_MAX); f0 = FOV_MAX; } catch (e) {}
            }
            statusEl.textContent = label + " · FoV " + Number(f0).toFixed(3) + "° · " +
              (rd && isFinite(rd[0]) ? Number(rd[0]).toFixed(4) + " " + Number(rd[1]).toFixed(4) : target) +
              " · JWST HiPS only";
          } catch (e) {}
        }
        setInterval(tick, 900);
        tick();
      }).catch(function (err) {
        statusEl.textContent = "Aladin failed: " + ((err && err.message) || err);
      });
    })();
  </script>
</body>
</html>
