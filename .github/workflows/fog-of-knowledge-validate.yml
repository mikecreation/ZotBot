name: Fog of Knowledge integrity

on:
  pull_request:
    paths:
      - "research/fog-of-knowledge/**"
  push:
    branches: [main]
    paths:
      - "research/fog-of-knowledge/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned PDF capture dependency
        run: python -m pip install -r research/fog-of-knowledge/requirements.txt

      - name: Install pinned Native integration test dependencies
        run: python -m pip install -r research/fog-of-knowledge/nemesis/integration/paged-planning/requirements-test.txt

      - name: Install locked offline editor test dependencies
        working-directory: research/fog-of-knowledge/nemesis/integration/brain-transport
        run: npm ci --ignore-scripts

      - name: Check retained browser transport and delivery regressions
        working-directory: research/fog-of-knowledge
        run: python scripts/test_brain_transport_source.py

      - name: Validate canonical knowledge graph
        working-directory: research/fog-of-knowledge
        run: python scripts/validate.py

      - name: Check retained scientific authority source and patch
        working-directory: research/fog-of-knowledge
        run: python scripts/test_native_authority_source.py

      - name: Check paged planner deployment and real retrieval process
        working-directory: research/fog-of-knowledge
        run: |
          python scripts/test_paged_planner_source.py --source-only
          python scripts/test_planning_recovery_source.py --full-native
          python scripts/test_retrieval_service.py

      - name: Check owned responses in the latest-response presentation
        working-directory: research/fog-of-knowledge
        run: |
          python scripts/test_response_ownership_source.py
          python scripts/test_blank_composer_source.py
          python scripts/test_text_first_source.py
          python scripts/test_tab_recovery_source.py
          python scripts/test_upload_recovery_source.py
          python scripts/test_status_scan_source.py
          python scripts/test_completed_fence_source.py

      - name: Check engineering contracts and affected boundary path
        working-directory: research/fog-of-knowledge
        run: |
          python scripts/engineering_guard.py --report /tmp/nemesis-affected-path.json
          python scripts/test_engineering_integrity.py
          python scripts/test_engineering_guard.py
          python scripts/test_boundary_upgrade.py
          python scripts/test_mission_watchdog.py

      - name: Check navigation and ingestion regressions
        working-directory: research/fog-of-knowledge
        run: |
          python scripts/test_atlas_integrity.py
          python scripts/test_atlas_preview.py
          node scripts/test_live_preview.js

      - name: Check atlas renderer syntax
        working-directory: research/fog-of-knowledge
        run: |
          node --check app.js
          node --check atlas-interaction.js
          node --check branch-layout.js
          node --check circuit-worker.js
          node --check circuit-spatial.js
          node --check circuit-painter.js
          node --check circuit-routing.js
          node --check massive-atlas.js
          node --check node-connections.js
          node --check public-frontier.js
          node --check review-desk.js

      - name: Enforce atlas geometry invariants
        working-directory: research/fog-of-knowledge
        run: |
          node scripts/check_layout.js
          node scripts/test_circuit_worker.js
          node scripts/test_node_connections.js

      - name: Generate Nemesis context packet
        working-directory: research/fog-of-knowledge
        run: |
          python scripts/nemesis_context.py --max-items 5 --compact > /tmp/nemesis-context.json
          python -m json.tool /tmp/nemesis-context.json > /dev/null
          python scripts/test_coverage_context.py
          python scripts/test_mission_acceptance.py

      - name: Test evidence compiler and quarantined imports
        working-directory: research/fog-of-knowledge
        run: |
          python scripts/test_evidence_compiler.py
          python scripts/test_nemesis_exchange.py
