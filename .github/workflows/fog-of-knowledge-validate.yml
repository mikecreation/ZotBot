name: Fog of Knowledge integrity

on:
  pull_request:
    paths:
      - "research/fog-of-knowledge/**"
  push:
    branches: [main]
    paths:
      - "research/fog-of-knowledge/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate canonical knowledge graph
        working-directory: research/fog-of-knowledge
        run: python scripts/validate.py

      - name: Check atlas renderer syntax
        working-directory: research/fog-of-knowledge
        run: node --check app.js

      - name: Generate Nemesis context packet
        working-directory: research/fog-of-knowledge
        run: |
          python scripts/nemesis_context.py --max-items 5 --compact > /tmp/nemesis-context.json
          python -m json.tool /tmp/nemesis-context.json > /dev/null

      - name: Check Nemesis example batch
        working-directory: research/fog-of-knowledge
        run: python scripts/nemesis_apply.py nemesis/example-batch --check

      - name: Prove Nemesis batch idempotency
        working-directory: research/fog-of-knowledge
        run: |
          python scripts/nemesis_apply.py nemesis/example-batch --apply
          python scripts/validate.py
          sha256sum data/knowledge.json > /tmp/fog-first.sha
          python scripts/nemesis_apply.py nemesis/example-batch --apply
          sha256sum -c /tmp/fog-first.sha
