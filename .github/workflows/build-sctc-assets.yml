name: Build SCTC final paper

on:
  push:
    branches: [main]
    paths:
      - 'research/not-so-hard-problem-of-consciousness/paper/**'
      - 'research/not-so-hard-problem-of-consciousness/README.md'
      - 'research/not-so-hard-problem-of-consciousness/CITATION.cff'
      - '.github/workflows/build-sctc-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science

      - name: Build paper
        working-directory: research/not-so-hard-problem-of-consciousness/paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error The-Not-So-Hard-Problem-of-Consciousness_FINAL.tex
          pdflatex -interaction=nonstopmode -halt-on-error The-Not-So-Hard-Problem-of-Consciousness_FINAL.tex
          rm -f *.aux *.log *.out

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/not-so-hard-problem-of-consciousness/paper/The-Not-So-Hard-Problem-of-Consciousness_FINAL.pdf
          if git diff --cached --quiet; then
            echo "PDF already current."
          else
            git commit -m "Build final SCTC paper [skip ci]"
            git push
          fi
